summary: >
  For superintendents and project managers who write the emails and the daily log.
  Garrett Mott, a construction trial lawyer, walks through how five emails from a
  young PM became Exhibit 12 in a case he puts at about $30 million, and why a
  note written the same day is the record a jury will believe. You leave with
  the habit of stating what happened, not what you concluded, and of keeping
  the daily log while the work is still going on.
