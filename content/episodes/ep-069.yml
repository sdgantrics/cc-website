summary: >
  For the project manager, the executive, and the founder who still treats a
  good relationship as the thing that keeps a job out of a dispute. Josh Levy
  of Document Crunch and Matthew Ramage of Trimble, recorded live at Trimble
  Dimensions, talk through what changes when the field record and the contract
  can be checked against each other. You leave with a test for an AI tool, a
  reason not to gamble a thin margin on trust, and a picture of why getting
  trade partners paid is risk management.
